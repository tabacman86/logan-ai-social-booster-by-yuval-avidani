<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>Social Media Auto Engager</h1>
        
        <div class="section">
            <h3>🤖 הגדרות Cohere API</h3>
            <div class="setting-item">
                <label for="cohereApiKey">API Key:</label>
                <input type="password" id="cohereApiKey" placeholder="הכנס את ה-API Key שלך">
                <div id="apiTestResult" class="api-test-result"></div>
            </div>
        </div>

        <div class="section">
            <h3>👤 ניהול פרסונות</h3>
            <div class="setting-item">
                <label for="activePersona">פרסונה פעילה:</label>
                <select id="activePersona">
                    <option value="">ללא פרסונה</option>
                </select>
                <button id="managePersonas" class="btn-secondary">נהל פרסונות</button>
            </div>
        </div>
        
        <div class="section">
            <h3>הגדרות תגובות</h3>
            <div class="toggle-container">
                <label>
                    <input type="checkbox" id="autoLike">
                    <span class="toggle-text">לייק אוטומטי</span>
                </label>
            </div>
            <div class="toggle-container">
                <label>
                    <input type="checkbox" id="autoComment">
                    <span class="toggle-text">תגובות אוטומטיות</span>
                </label>
            </div>
        </div>
        
        <div class="section">
            <h3>סגנון תגובות</h3>
            <select id="commentStyle">
                <option value="professional">מקצועי</option>
                <option value="friendly">ידידותי</option>
                <option value="encouraging">מעודד</option>
                <option value="thoughtful">מחשיב</option>
            </select>
        </div>
        
        <div class="section">
            <h3>פלטפורמות</h3>
            <div class="toggle-container">
                <label>
                    <input type="checkbox" id="enableLinkedIn" checked>
                    <span class="toggle-text">LinkedIn</span>
                </label>
            </div>
            <div class="toggle-container">
                <label>
                    <input type="checkbox" id="enableFacebook" checked>
                    <span class="toggle-text">Facebook</span>
                </label>
            </div>
        </div>
        
        <div class="status" id="status"></div>
        
        <button id="saveSettings" class="primary-btn">שמור הגדרות</button>
    </div>
    
    <!-- Persona Management Modal -->
    <div id="personaModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>ניהול פרסונות</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="persona-list">
                    <h4>פרסונות קיימות:</h4>
                    <div id="personasList"></div>
                    <button id="addPersona" class="btn-primary">הוסף פרסונה חדשה</button>
                </div>
                
                <div id="personaEditor" class="persona-editor" style="display: none;">
                    <h4 id="editorTitle">פרסונה חדשה</h4>
                    <div class="form-group">
                        <label for="personaName">שם הפרסונה:</label>
                        <input type="text" id="personaName" placeholder="למשל: יובל המקצועי">
                    </div>
                    <div class="form-group">
                        <label for="personaDescription">תיאור הפרסונה:</label>
                        <textarea id="personaDescription" placeholder="תאר את הסגנון והטון של הפרסונה"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="personaExamples">דוגמאות פוסטים בסגנון שלך:</label>
                        <div id="examplesList"></div>
                        <textarea id="newExample" placeholder="הוסף דוגמה של פוסט או תגובה בסגנון שלך"></textarea>
                        <button id="addExample" class="btn-secondary">הוסף דוגמה</button>
                    </div>
                    <div class="form-actions">
                        <button id="savePersona" class="btn-primary">שמור פרסונה</button>
                        <button id="cancelEdit" class="btn-secondary">ביטול</button>
                        <button id="deletePersona" class="btn-danger" style="display: none;">מחק פרסונה</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
